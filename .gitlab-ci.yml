# lazy-o-godot CI — Roslyn source generators for Godot, shipped as a NuGet package
#
#   test     every pipeline        build it, then pack it and make a throwaway
#                                   consumer project actually load the generators
#   tag      main, if test passed  reserve the next release version and tag this
#                                   commit with it (pushed with `-o ci.skip`, so
#                                   this does NOT spawn a second pipeline)
#   publish  main / tag            push the .nupkg to the project NuGet feed
#
# One pipeline, one linear pass, one release per green commit on the default
# branch. A human can still cut a specific major/minor by pushing a `vX.Y.Z` tag
# directly (auto-tag then bumps the patch from *that* tag next time) — that tag
# runs its own ordinary pipeline through publish, same as always.
#
# No Docker anywhere: this repo produces exactly one artifact, a .nupkg, and
# packing/pushing that is a plain `dotnet` operation. Everything runs in the SDK
# image.
#
# Deliberately NOT ported from the vbeami pipeline this is modelled on: a
# `sync-version-markers` job. There, a version number was baked into a
# load-bearing dotquay.toml that consumers resolve against. Here the only
# in-tree version is the csproj's <Version>, which CI overrides on every pack
# (-p:Version=) and which therefore only ever affects a developer's local
# `dotnet pack`. Committing a marker bump back per release would be a commit of
# pure noise. If an in-tree manifest ever does become load-bearing, copy that
# job over verbatim — auto-tag already provides the token and $RELEASE_VERSION
# it needs.

stages:
  - test
  - tag
  - publish

# Avoid the duplicate-pipeline problem: one pipeline per MR, one per push to a
# branch with no open MR, plus tags. auto-tag's own tag push below is separately
# suppressed with `-o ci.skip`, so it never reaches this evaluation at all —
# this workflow is what still lets a *human* pushing a `vX.Y.Z` tag by hand get
# a normal tag pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  GIT_DEPTH: "20"
  GIT_SUBMODULE_STRATEGY: none
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # Project-scoped NuGet v3 feed. CI_JOB_TOKEN is accepted as the API key for
  # THIS project's own registry, so pushing needs no PAT or deploy token — only
  # consumers restoring the package need one.
  NUGET_REGISTRY: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/nuget/index.json
  # The Godot.NET.Sdk the smoke consumer builds with — the same SDK a real
  # Godot game project uses, so the generated code is compiled in exactly the
  # environment it ships into. The generators emit code referencing Godot types
  # directly, so a binding break shows up here as a compile error and nowhere
  # else. Keep this in step with what real consumers are on.
  GODOT_SDK_VERSION: "4.7.2"

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0-noble
  variables:
    # Keep the package cache inside the project so GitLab can cache it.
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget
  cache:
    key:
      files:
        - dev.kani.godot.generator.csproj
    paths:
      - .nuget/

# ---------------------------------------------------------------------------
# build — does the generator itself compile
# ---------------------------------------------------------------------------
build:
  extends: .dotnet
  stage: test
  script:
    - dotnet build dev.kani.godot.generator.csproj -c Release

# Warnings are not build errors in the csproj, so surface them here rather than
# letting them accumulate unseen. Non-blocking on purpose.
build:warnings:
  extends: .dotnet
  stage: test
  allow_failure: true
  script:
    - dotnet build dev.kani.godot.generator.csproj -c Release -warnaserror

# ---------------------------------------------------------------------------
# package:smoke — pack it, then make a real consumer prove the generators run
# ---------------------------------------------------------------------------
# A source generator package fails *silently*. If the DLL lands anywhere but
# analyzers/dotnet/cs, or the package declares dependencies (analyzers get no
# dependency resolution), or it is built against a Roslyn newer than the
# consumer's compiler, then `dotnet restore` succeeds, `dotnet build` succeeds,
# and simply no code is generated. Nothing fails until a human notices their
# `[Autowire]` fields are gone. `dotnet pack` on its own catches none of that.
#
# So this job packs the package and then consumes it the way a real project
# does — PackageReference, from a local feed, against real Godot fixture files
# — and asserts the generators actually produced usable members. Five distinct
# checks, each catching a different silent failure:
#
#   1. analyzers/dotnet/cs/Generators.dll exists in the *restored* package.
#      Checks the packed layout without needing unzip in the image.
#   2. no lib/ in the restored package. A lib/ entry means IncludeBuildOutput
#      slipped back on, which turns this into a runtime reference and drags a
#      netstandard2.1 target into every consumer.
#   3. the consumer compiles, with CS8032 promoted to an error. CS8032 ("an
#      instance of analyzer cannot be created") is the compiler's *warning* for
#      a generator that failed to load — the exact failure that ships green.
#   4. Smoke.cs *uses* generated members (Actions.moveforward, Groups.enemies,
#      Scenes.PathPlayerShip). This is the real assertion, and it is enforced by
#      the compiler rather than by grepping output: if any of those generators
#      stops emitting, the build dies with CS0117 instead of quietly producing
#      an empty class.
#   5. the packed nuspec declares developmentDependency. That flag is what makes
#      NuGet apply PrivateAssets=all for a PackageReference consumer; without it
#      the generator flows on to anything consuming a consumer, and every
#      consumer has to write that metadata into its own csproj by hand.
#
# Two things this consumer needs that are easy to get wrong:
#
#   The Godot types. Every generator here emits code with `using Godot;` in it
#   — Sync emits SceneReplicationConfig.ReplicationMode, Scenes emits
#   GD.Load<PackedScene>, Actions and Groups emit StringName. Without those
#   types in scope the smoke build fails with a wall of CS0246 even though the
#   generators ran perfectly. Building on Godot.NET.Sdk supplies them, and
#   matches how consumers actually build. (The bare GodotSharp package is
#   enough to compile, but the full SDK also exercises the generated code
#   alongside Godot's own source generators, which is closer to the real
#   thing — and is why the output paths below need pinning.)
#
#   AdditionalFiles. Five of the generators are driven entirely by Godot files
#   rather than by C# syntax: Actions and Groups parse the [input] and
#   [global_group] sections of project.godot, Scenes globs *.tscn, Resource
#   globs *.tres. With no AdditionalFiles they all still run and still compile —
#   they just emit an empty class. That is a passing build that proves nothing,
#   which is why the fixtures below exist.
package:smoke:
  extends: .dotnet
  stage: test
  needs: []
  variables:
    PKG_ID: Dev.Kani.Godot.Generator
    # Lowercased id — the extracted package directory under NUGET_PACKAGES is
    # always lowercase, and on a case-sensitive filesystem that matters.
    PKG_DIR_ID: dev.kani.godot.generator
  script:
    - PKG_VERSION="0.0.0-ci-$CI_COMMIT_SHORT_SHA"
    - dotnet pack dev.kani.godot.generator.csproj -c Release -p:Version="$PKG_VERSION" -o "$CI_PROJECT_DIR/pkg"

    - mkdir -p "$CI_PROJECT_DIR/smoke"
    - cd "$CI_PROJECT_DIR/smoke"

    # <clear/> then two explicit sources: the local pack output wins for our own
    # package, nuget.org supplies Godot.NET.Sdk. Without the clear, a runner with
    # an inherited machine-level config could resolve PKG_ID from somewhere else
    # entirely and smoke-test a stale already-published package.
    - |
      cat > nuget.config <<EOF
      <?xml version="1.0" encoding="utf-8"?>
      <configuration>
        <packageSources>
          <clear />
          <add key="local" value="$CI_PROJECT_DIR/pkg" />
          <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
        </packageSources>
      </configuration>
      EOF

    # EmitCompilerGeneratedFiles is what puts the generated sources on disk, so
    # a failure here leaves the actual generator output in the job artifacts to
    # look at instead of just a compiler error.
    #
    # CompilerGeneratedFilesOutputPath is pinned rather than left to default,
    # because Godot.NET.Sdk redirects the intermediate output into
    # .godot/mono/temp/obj/ AND drops the target-framework segment. The default
    # location therefore differs between SDKs:
    #   Microsoft.NET.Sdk  obj/Release/net10.0/generated/...
    #   Godot.NET.Sdk      .godot/mono/temp/obj/Release/generated/...
    # Anything downstream that hardcodes one is wrong under the other, so name
    # the directory explicitly and let both SDKs agree on it.
    - |
      cat > smoke.csproj <<EOF
      <Project Sdk="Godot.NET.Sdk/$GODOT_SDK_VERSION">
        <PropertyGroup>
          <TargetFramework>net10.0</TargetFramework>
          <Nullable>enable</Nullable>
          <WarningsAsErrors>CS8032;CS8034</WarningsAsErrors>
          <EmitCompilerGeneratedFiles>true</EmitCompilerGeneratedFiles>
          <CompilerGeneratedFilesOutputPath>\$(MSBuildProjectDirectory)/generated</CompilerGeneratedFilesOutputPath>
        </PropertyGroup>
        <ItemGroup>
          <PackageReference Include="$PKG_ID" Version="$PKG_VERSION" />
        </ItemGroup>
        <ItemGroup>
          <AdditionalFiles Include="project.godot" />
          <AdditionalFiles Include="fixture/**/*.tscn" />
        </ItemGroup>
      </Project>
      EOF

    # Fixture Godot project file. ActionGenerator reads [input] and
    # GroupGenerator reads [global_group]; both stop at the next [section], so
    # the [application] header above them is deliberate — it proves the parsers
    # skip sections they do not own rather than swallowing the whole file.
    # Quoted heredocs from here down: this content must reach disk verbatim,
    # never through shell expansion.
    - |
      cat > project.godot <<'EOF'
      [application]

      config/name="smoke"

      [global_group]

      enemies="Every hostile unit"
      players="Player controlled units"

      [input]

      move_forward={
      "deadzone": 0.5
      }
      ui_smoke_accept={
      "deadzone": 0.5
      }
      EOF

    # SceneGenerator only reads the .tscn's *path*, never its contents, but a
    # plausible file keeps this honest. player_ship -> PathPlayerShip via
    # SnakeToCamelCase.
    - mkdir -p fixture
    - |
      cat > fixture/player_ship.tscn <<'EOF'
      [gd_scene format=3]

      [node name="PlayerShip" type="Node2D"]
      EOF

    # Check 4. Every member referenced here comes from a different generator and
    # exists only if that generator ran against the fixtures above. The compiler
    # is the assertion.
    - |
      cat > Smoke.cs <<'EOF'
      using Godot;
      using GenUtilities;

      internal static class Smoke {
          internal static void Main() {
              StringName action = Actions.moveforward;   // ActionGenerator, [input]
              StringName group = Groups.enemies;         // GroupGenerator, [global_group]
              string scenePath = Scenes.PathPlayerShip;  // SceneGenerator, *.tscn
              System.Console.WriteLine($"{action} {group} {scenePath}");
          }
      }
      EOF

    - dotnet restore

    # 1 + 2: the restored package layout.
    - |
      RESTORED="$NUGET_PACKAGES/$PKG_DIR_ID/$PKG_VERSION"
      if [ ! -f "$RESTORED/analyzers/dotnet/cs/Generators.dll" ]; then
        echo "FAIL: Generators.dll is not at analyzers/dotnet/cs/ in the package."
        echo "      The consumer's compiler will never load it. Package contents:"
        find "$RESTORED" -type f | sed "s|$RESTORED/|  |"
        exit 1
      fi
      if [ -d "$RESTORED/lib" ]; then
        echo "FAIL: the package has a lib/ directory — IncludeBuildOutput is back on."
        echo "      That ships the generator as a runtime reference, not an analyzer."
        exit 1
      fi
      NUSPEC="$RESTORED/$PKG_DIR_ID.nuspec"
      if ! grep -q '<developmentDependency>true</developmentDependency>' "$NUSPEC"; then
        echo "FAIL: the nuspec does not declare developmentDependency."
        echo "      NuGet then stops applying PrivateAssets=all for consumers, so the"
        echo "      generator leaks onward and every consumer must write the metadata"
        echo "      by hand. Check <DevelopmentDependency> in the csproj."
        cat "$NUSPEC"
        exit 1
      fi

    # Checks 3 and 4 both happen in this one build: CS8032-as-error catches a
    # generator that failed to load, and Smoke.cs fails to compile if the
    # fixture-driven generators produced nothing.
    - dotnet build -c Release

    # Belt and braces, purely for the error message. If the build above somehow
    # passes with no generated output at all, this says so in one line instead
    # of leaving someone to infer it. AutowireAttribute is emitted
    # unconditionally by AutowireGenerator (it needs no annotated types and no
    # AdditionalFiles), so its absence means nothing ran.
    - |
      MARKER="generated/Generators/GenUtilities.AutowireGenerator/AutowireAttribute.g.cs"
      if [ ! -f "$MARKER" ]; then
        echo "FAIL: no generated sources — the generators loaded but produced nothing,"
        echo "      or did not load at all. Expected $MARKER"
        find . -name '*.g.cs' -not -path './.nuget/*' -print || true
        exit 1
      fi
      echo "generated sources:"
      find generated -name '*.g.cs' | sed 's|^generated/Generators/|  |'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - pkg/
      - smoke/generated/

# ---------------------------------------------------------------------------
# auto-tag — reserve the next release version for this commit, in-pipeline
# ---------------------------------------------------------------------------
# Runs only on an ordinary push to $CI_DEFAULT_BRANCH (not MR pipelines, not tag
# pipelines — $CI_COMMIT_BRANCH is unset for both), and only after the `test`
# stage passed: a tag created here cascades directly into a real, immutable
# NuGet release later in this same pipeline, and a published package version
# cannot be quietly un-shipped. (build:warnings is allow_failure and does not
# gate this; build and package:smoke do.)
#
# Finds the highest existing `vX.Y.Z` tag via git's own semver-aware
# `--sort=-v:refname` (not `git describe`, which needs the tag to be a commit
# ancestor — irrelevant here, we always tag the branch tip) and bumps the patch
# digit. Patch-only, deliberately dumb: to cut a specific major/minor instead,
# tag it yourself before pushing — a manual tag becomes the new baseline.
#
# `git fetch origin --tags` is explicit rather than relying on the runner's
# clone behavior, because GIT_DEPTH bounds commit history, not which tags get
# fetched, and this must see every release tag that exists.
#
# `-o ci.skip` on the tag push is the load-bearing bit: without it, pushing a
# tag spawns a *second*, independent pipeline for the same commit (GitLab treats
# tag and branch pipelines as unrelated), racing a second release attempt
# against this one. The reserved version reaches the rest of *this* pipeline via
# a dotenv artifact (RELEASE_VERSION); publish declares
# `needs: [{job: auto-tag, optional: true}]` — optional because auto-tag does
# not run at all in MR or manual-tag pipelines.
#
# Needs a $VERSION_BUMP_TOKEN CI/CD variable (protected + masked): a Project
# Access Token, Settings → Access Tokens, scope write_repository, role Developer
# or higher. $CI_JOB_TOKEN can push to this project's package registry but not
# commits or tags. If the default branch is protected, that token's role also
# needs "allowed to push" on it (and protected tags a matching allowance for
# `v*`), or this job fails at the push step.
auto-tag:
  stage: tag
  image:
    name: alpine/git:latest
    # alpine/git's ENTRYPOINT is `git`, not a shell, so the runner's default
    # `sh -c "<script>"` becomes `git sh -c "<script>"` — hence
    # "git: 'sh' is not a git command." Blank it so the runner's shell runs.
    entrypoint: [""]
  # No `needs:`, so GitLab would otherwise hand this job every artifact from the
  # test stage — including package:smoke's generated sources, which this job has
  # no use for. Harmless here (it only runs git), but the stage ordering is what
  # gates this job, not the artifacts.
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      git fetch origin --tags --quiet

      LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
      if [ -z "$LATEST_TAG" ]; then LATEST_TAG="v0.0.0"; fi

      BASE="${LATEST_TAG#v}"
      MAJOR="${BASE%%.*}"
      REST="${BASE#*.}"
      MINOR="${REST%%.*}"
      PATCH="${REST#*.}"
      NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
      NEW_TAG="v$NEXT"
      echo "latest release: $LATEST_TAG -> tagging $CI_COMMIT_SHORT_SHA as $NEW_TAG"

      echo "RELEASE_VERSION=$NEXT" >> release.env

      git tag "$NEW_TAG" "$CI_COMMIT_SHA"
      git push -o ci.skip "https://lazy-o-ci:${VERSION_BUMP_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "refs/tags/$NEW_TAG"
  artifacts:
    reports:
      dotenv: release.env

# ---------------------------------------------------------------------------
# publish:nuget — the actual release
# ---------------------------------------------------------------------------
# Version is a two-way fallback: a human's `$CI_COMMIT_TAG` when this ran
# because of a manual tag, else auto-tag's `$RELEASE_VERSION` reserved for this
# pipeline. Computed in the script, not in `variables:`, because GitLab's
# variable expansion does plain $NAME substitution only; the shell
# parameter-expansion fallback needs a real shell.
#
# This repacks rather than reusing package:smoke's artifact, because that one is
# deliberately versioned `0.0.0-ci-<sha>` and a .nupkg's version is baked into
# its filename and its nuspec — it cannot be retagged the way a Docker image
# can. Same commit, same inputs, same deterministic pack.
publish:nuget:
  extends: .dotnet
  stage: publish
  # artifacts: false on the two test jobs — this job needs them as *gates*, not
  # for their output. package:smoke's artifacts are the smoke consumer's
  # generated Godot code under smoke/generated/, and downloading that into the
  # workspace puts .cs files under the repo root, where this project's default
  # `**/*.cs` glob picks them up and the pack below dies with CS0246 on code it
  # does not own. (The csproj also excludes smoke/ explicitly, so this is
  # belt-and-braces — but not fetching megabytes of artifacts a job will never
  # read is right regardless.)
  #
  # auto-tag keeps its artifacts: its dotenv report is the only way
  # $RELEASE_VERSION reaches this job.
  needs:
    - job: auto-tag
      optional: true
    - job: build
      artifacts: false
    - job: package:smoke
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      PKG_VERSION="${CI_COMMIT_TAG#v}"
      PKG_VERSION="${PKG_VERSION:-$RELEASE_VERSION}"
      if [ -z "$PKG_VERSION" ]; then
        echo "FAIL: no version to publish — neither a vX.Y.Z tag nor auto-tag's RELEASE_VERSION."
        exit 1
      fi
      echo "packing Dev.Kani.Godot.Generator $PKG_VERSION"
      dotnet pack dev.kani.godot.generator.csproj -c Release -p:Version="$PKG_VERSION" -o pkg
    # NOT --skip-duplicate: re-pushing an already-published version silently
    # would hide a real mistake (a retagged release, two concurrent pipelines
    # reserving the same patch). This must fail loudly instead, on purpose.
    - dotnet nuget push "pkg/*.nupkg" --source "$NUGET_REGISTRY" --api-key "$CI_JOB_TOKEN"
  artifacts:
    expire_in: 1 year
    paths:
      - pkg/
  environment:
    name: registry
    url: $CI_SERVER_URL/$CI_PROJECT_PATH/-/packages
